<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Propellers -->
  <g stroke="#e5e7eb" stroke-width="3" opacity="0.85">
    <ellipse cx="90" cy="90" rx="58" ry="14" transform="rotate(-45 90 90)"/>
    <ellipse cx="310" cy="90" rx="58" ry="14" transform="rotate(45 310 90)"/>
    <ellipse cx="90" cy="310" rx="58" ry="14" transform="rotate(45 90 310)"/>
    <ellipse cx="310" cy="310" rx="58" ry="14" transform="rotate(-45 310 310)"/>
  </g>

  <!-- Arms -->
  <g stroke="#9ca3af" stroke-width="14" stroke-linecap="round">
    <line x1="200" y1="200" x2="90" y2="90"/>
    <line x1="200" y1="200" x2="310" y2="90"/>
    <line x1="200" y1="200" x2="90" y2="310"/>
    <line x1="200" y1="200" x2="310" y2="310"/>
  </g>

  <!-- Motor hubs -->
  <g fill="#111827" stroke="#e5e7eb" stroke-width="3">
    <circle cx="90" cy="90" r="16"/>
    <circle cx="310" cy="90" r="16"/>
    <circle cx="90" cy="310" r="16"/>
    <circle cx="310" cy="310" r="16"/>
  </g>

  <!-- Central body -->
  <rect x="150" y="150" width="100" height="100" rx="24" fill="#1f2937" stroke="#e5e7eb" stroke-width="3"/>

  <!-- Camera gimbal -->
  <circle cx="200" cy="220" r="22" fill="#0b0f14" stroke="#e5e7eb" stroke-width="3"/>
  <circle cx="200" cy="220" r="9" fill="#e5e7eb"/>

  <!-- Top accent -->
  <rect x="175" y="165" width="50" height="8" rx="4" fill="#e5e7eb" opacity="0.6"/>

  <!-- Status lights -->
  <circle cx="163" cy="237" r="3.5" fill="#22c55e"/>
  <circle cx="237" cy="237" r="3.5" fill="#ef4444"/>
</svg>
